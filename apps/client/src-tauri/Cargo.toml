[package]
name = "lune"
version = "2.0.0"
edition = "2021"

# Android/iOS 构建需要以库形式挂载入口,桌面端 main.rs 亦调用同一 run()
[lib]
name = "lune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-lune-media = { path = "tauri-plugin-lune-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
